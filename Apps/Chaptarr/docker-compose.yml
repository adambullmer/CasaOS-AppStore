      ## 주요 기능

      - 하나의 통합 인터페이스에서 전자책과 오디오북 **모두** 관리
      - *arr 스타일 자동화: 저자/책 추가, 품질 프로필 설정 후 나머지는 Chaptarr가 처리
      - qBittorrent, SABnzbd, NZBGet 등의 다운로드 클라이언트 및 Prowlarr 등 인덱서와 연동
      - 기존 Readarr의 메타데이터 매핑 문제를 해결하도록 설계
      - Audiobookshelf, Calibre-Web 등 라이브러리 프론트엔드와 함께 사용 가능

      ## CasaOS에서 실행하는 이유

      CasaOS 기기에 Chaptarr를 배포하면 책 자동화 파이프라인 전체를 로컬로 유지할 수 있습니다
