      ko_KR: |
        **Chaptarr는 현재 활발한 사전 릴리스 개발 단계(Alpha/Beta)에 있습니다.**
        업데이트 사이에 주요 변경 사항이 발생할 수 있습니다. 업그레이드 전에
        `/config` 볼륨을 백업해 두세요.

        첫 실행 시 WebUI를 방문하여 초기 설정을 완료하세요:
        - 루트 폴더 추가 (`/books`)
        - 다운로드 클라이언트 설정
        - Prowlarr을 통하거나 수동으로 인덱서 추가

        커뮤니티 지원은 공식 **Discord 서버**에서 받을 수 있습니다 — 도움말, 버그 보고,
        릴리스 공지의 기본 채널입니다.
      ru_RU: |
        **Chaptarr в настоящее время находится в стадии активной предрелизной разработки (Alpha/Beta).**
        Между обновлениями возможны ломающие изменения. Создайте резервную копию тома
        `/config` перед обновлением.

        При первом запуске откройте веб-интерфейс для завершения начальной настройки:
        - Добавьте корневые папки (`/books`)
        - Настройте клиент загрузки
        - Добавьте индексаторы через Prowlarr или вручную

        Поддержка сообщества доступна на официальном **сервере Discord** — это основной
