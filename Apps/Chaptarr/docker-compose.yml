      无需两个独立应用。它将成熟的 *arr 套件工作流带到书籍爱好者的世界——自动监控、质量管理，
      以及与主流下载客户端和索引器的深度集成。

      ## 主要特性

      - 通过统一界面同时管理电子书和有声书
      - *arr 风格自动化：添加作者/书目，设置质量配置文件，剩下的交给 Chaptarr
      - 支持与 qBittorrent、SABnzbd、NZBGet 等下载客户端及 Prowlarr 等索引器集成
      - 专门修复了原 Readarr 中存在的元数据映射问题
      - 可与 Audiobookshelf、Calibre-Web 等书库前端协同使用

      ## 为什么在 CasaOS 上运行？

      在 CasaOS 设备上部署 Chaptarr，让整个书籍自动化流程保持本地化——无需云订阅，
      数据不离家。与同设备上的 Audiobookshelf 或 Calibre-Web 搭配使用，在低功耗硬件上
      构建全自托管、私密的阅读与收听体验。
    zh_TW: |
      # Chaptarr — 統一有聲書與電子書管理器

      Chaptarr 是已停止維護的 Readarr 的活躍分支，專為同時管理有聲書和電子書收藏而設計，
      無需兩個獨立應用程式。它將成熟的 *arr 套件工作流程帶到書籍愛好者的世界——自動監控、
      品質管理，以及與主流下載客戶端和索引器的深度整合。

      ## 主要功能

      - 透過統一介面同時管理電子書和有聲書
      - *arr 風格自動化：新增作者/書目，設定品質設定檔，其餘交由 Chaptarr 處理
      - 支援與 qBittorrent、SABnzbd、NZBGet 等下載客戶端及 Prowlarr 等索引器整合
      - 專門修復了原 Readarr 中存在的元數據對應問題
      - 可與 Audiobookshelf、Calibre-Web 等書庫前端協同使用

      ## 為何在 CasaOS 上執行？

      在 CasaOS 裝置上部署 Chaptarr，讓整個書籍自動化流程保持本地化——無需雲端訂閱，
      資料不離家。與同裝置上的 Audiobookshelf 或 Calibre-Web 搭配使用，在低功耗硬體上
      建構全自託管、私密的閱讀與聆聽體驗。
