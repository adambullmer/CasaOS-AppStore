      CasaOS デバイスに Chaptarr を導入することで、書籍の自動化パイプライン全体をローカルに
      保てます——クラウドサブスクリプション不要、データはホームネットワークから出ません。
      同じデバイスで Audiobookshelf や Calibre-Web と組み合わせれば、低消費電力ハードウェア上で
