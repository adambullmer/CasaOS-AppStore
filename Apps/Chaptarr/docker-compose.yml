      ja_JP: |
        **Chaptarr は現在、活発なプレリリース開発段階にあります（Alpha/Beta）。**
        アップデート間で破壊的変更が発生することがあります。アップグレード前に
        `/config` ボリュームをバックアップしてください。

        初回起動時は、WebUI にアクセスして初期設定を完了してください：
        - ルートフォルダを追加 (`/books`)
