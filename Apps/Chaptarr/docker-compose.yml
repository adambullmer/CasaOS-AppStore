      sv_SE: |
        **Chaptarr befinner sig för närvarande i aktiv förhandsutveckling (Alpha/Beta).**
        Förvänta dig att brytande ändringar kan inträffa mellan uppdateringar. Säkerhetskopiera
        din `/config`-volym innan du uppgraderar.

        Vid första start, besök webbgränssnittet för att slutföra den initiala inställningen:
        - Lägg till dina rotmappar (`/books`)
        - Konfigurera din nedladdningsklient
        - Lägg till indexerare via Prowlarr eller manuellt

        Community-stöd finns tillgängligt på den officiella **Discord-servern** — det är den
        primära kanalen för hjälp, felrapporter och versionsmeddelanden.
      pt_PT: |
        **O Chaptarr encontra-se atualmente em desenvolvimento pré-lançamento ativo (Alpha/Beta).**
        Podem ocorrer alterações de rutura entre atualizações. Faça uma cópia de segurança
        do seu volume `/config` antes de atualizar.

        No primeiro lançamento, visite a interface web para concluir a configuração inicial:
        - Adicione as suas pastas raiz (`/books`)
        - Configure o seu cliente de download
        - Adicione indexadores através do Prowlarr ou manualmente

        O suporte da comunidade está disponível no **servidor oficial do Discord** — este é o
        canal principal para obter ajuda, reportar erros e receber anúncios de lançamento.
