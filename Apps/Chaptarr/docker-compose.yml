      fr_FR: |
        **Chaptarr est actuellement en développement pré-version active (Alpha/Beta).**
        Des changements cassants peuvent survenir entre les mises à jour. Sauvegardez votre
        volume `/config` avant de mettre à jour.

        Au premier lancement, visitez l'interface web pour terminer la configuration initiale :
        - Ajoutez vos dossiers racines (`/books`)
        - Configurez votre client de téléchargement
        - Ajoutez des indexeurs via Prowlarr ou manuellement

        Le support communautaire est disponible sur le **serveur Discord officiel** — c'est le
