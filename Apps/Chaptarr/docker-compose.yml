  tips:
    before_install:
      en_US: |
        **Chaptarr is currently in active pre-release development (Alpha/Beta).**
        Expect occasional breaking changes between updates. Back up your `/config`
        volume before upgrading.

        On first launch, visit the web UI to complete initial setup:
        - Add your root folders (`/books`)
        - Configure your download client
        - Add indexers via Prowlarr or manually

        Community support is available on the official **Discord server** — this is the
        primary channel for help, bug reports, and release announcements.
      zh_CN: |
        **Chaptarr 目前处于积极的预发布开发阶段（Alpha/Beta）。**
        版本更新之间可能存在重大变更，升级前请备份 `/config` 目录。

        首次启动后，访问 WebUI 完成初始配置：
        - 添加根目录（`/books`）
        - 配置下载客户端
        - 通过 Prowlarr 或手动添加索引器

        官方 **Discord 服务器**是获取帮助、报告错误和接收发布公告的主要渠道。
      zh_TW: |
        **Chaptarr 目前處於積極的預發布開發階段（Alpha/Beta）。**
        版本更新之間可能存在重大變更，升級前請備份 `/config` 目錄。

        首次啟動後，訪問 WebUI 完成初始設定：
        - 新增根目錄（`/books`）
        - 設定下載客戶端
        - 透過 Prowlarr 或手動新增索引器

        官方 **Discord 伺服器**是獲取協助、回報錯誤和接收發布公告的主要管道。
      de_DE: |
        **Chaptarr befindet sich derzeit in aktiver Vorabentwicklung (Alpha/Beta).**
        Zwischen Updates können gelegentlich Breaking Changes auftreten. Sichere dein
        `/config`-Volume vor dem Upgrade.

        Besuche beim ersten Start die Web-Oberfläche, um die Ersteinrichtung abzuschließen:
        - Füge deine Stammordner hinzu (`/books`)
        - Konfiguriere deinen Download-Client
        - Füge Indexer über Prowlarr oder manuell hinzu

        Community-Support ist auf dem offiziellen **Discord-Server** verfügbar — das ist der
        primäre Kanal für Hilfe, Fehlerberichte und Release-Ankündigungen.
      es_ES: |
        **Chaptarr se encuentra actualmente en desarrollo previo al lanzamiento (Alpha/Beta).**
        Es posible que haya cambios importantes entre actualizaciones. Haz una copia de
        seguridad de tu volumen `/config` antes de actualizar.

        En el primer inicio, visita la interfaz web para completar la configuración inicial:
        - Añade tus carpetas raíz (`/books`)
        - Configura tu cliente de descarga
        - Añade indexadores mediante Prowlarr o manualmente

        El soporte de la comunidad está disponible en el **servidor oficial de Discord** — es el
        canal principal para obtener ayuda, reportar errores y recibir anuncios de versiones.
      es_419: |
        **Chaptarr está actualmente en desarrollo previo al lanzamiento (Alpha/Beta).**
