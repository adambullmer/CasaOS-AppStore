name: chaptarr

services:
  chaptarr:
    container_name: chaptarr
    image: robertlordhood/chaptarr:0.9.333
    environment:
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    network_mode: bridge
    ports:
      - target: 8787
        published: "${WEBUI_PORT:-8787}"
        protocol: tcp
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: "512M"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/Media/Books
        target: /books
      - type: bind
        source: /DATA/Downloads
        target: /downloads

    x-casaos:
      envs:
        - container: TZ
          description:
            en_us: Timezone
            zh_cn: 时区
        - container: PUID
          description:
            en_us: Run Chaptarr as the specified user ID.
            zh_cn: 以指定用户ID运行 Chaptarr
        - container: PGID
          description:
            en_us: Run Chaptarr as the specified group ID.
            zh_cn: 以指定组ID运行 Chaptarr
      ports:
        - container: "8787"
          description:
            en_us: WebUI HTTP Port
            zh_cn: WebUI HTTP端口
      volumes:
        - container: /config
          description:
            en_us: Chaptarr configuration and database directory.
            zh_cn: Chaptarr 配置及数据库目录
        - container: /books
          description:
            en_us: Books library root (ebooks and audiobooks).
            zh_cn: 书籍库根目录（电子书与有声书）
        - container: /downloads
          description:
            en_us: Download client completed downloads directory.
            zh_cn: 下载客户端完成目录

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: chaptarr
  author: adambullmer
  category: Books
  description:
    de_DE: |
      # Chaptarr — Einheitlicher Hörbuch- & E-Book-Manager

      Chaptarr ist ein aktiv weiterentwickelter Fork des eingestellten Readarr, der speziell
      dafür entwickelt wurde, Hörbuch- und E-Book-Sammlungen in einer einzigen Instanz zu
      verwalten. Es bringt den bewährten *arr-Suite-Workflow für Bücherliebhaber — automatische
      Überwachung, Qualitätsmanagement und Integration mit beliebten Download-Clients und Indexern.

      ## Hauptmerkmale

      - E-Books **und** Hörbücher über eine einheitliche Oberfläche verwalten
      - *arr-Automatisierung: Autoren/Bücher hinzufügen, Qualitätsprofile setzen, den Rest erledigt Chaptarr
      - Integration mit qBittorrent, SABnzbd, NZBGet u. a. sowie Indexern wie Prowlarr
      - Behebt die Metadaten-Zuordnungsprobleme des ursprünglichen Readarr
      - Funktioniert zusammen mit Audiobookshelf, Calibre-Web und anderen Bibliotheks-Frontends

      ## Warum auf CasaOS?

      Durch die Bereitstellung von Chaptarr auf deinem CasaOS-Gerät bleibt die gesamte
      Buchautomatisierung lokal — keine Cloud-Abonnements, keine Daten verlassen dein
      Heimnetzwerk. Kombiniere es auf demselben Gerät mit Audiobookshelf oder Calibre-Web
      für ein vollständig selbst gehostetes, privates Lese- und Hörerlebnis.
    en_US: |
      # Chaptarr — Unified Audiobook & Ebook Manager

      Chaptarr is an actively developed fork of the now-retired Readarr, purpose-built to
      manage both your audiobook and ebook collections in a single instance. It brings the
      familiar, polished *arr-suite workflow to book lovers — automatic monitoring, quality
      management, and integration with popular download clients and indexers.

      ## Key Features

      - Manage ebooks **and** audiobooks from one unified interface, no more separate apps
      - *arr-style automation: add authors/books, set quality profiles, let Chaptarr do the rest
      - Integrates with download clients (qBittorrent, SABnzbd, NZBGet, etc.) and indexers (Prowlarr)
      - Designed to fix the metadata mapping issues that plagued the original Readarr
      - Works alongside Audiobookshelf, Calibre-Web, and other library front-ends

      ## Why Run on CasaOS?

      Deploying Chaptarr on your CasaOS device keeps your entire book automation pipeline
      local — no cloud subscriptions, no data leaving your home network. Pair it with
      Audiobookshelf or Calibre-Web on the same device for a fully self-contained, private
      reading and listening experience running 24/7 on low-power hardware.
    es_419: |
      # Chaptarr — Gestor Unificado de Audiolibros y Libros Electrónicos

      Chaptarr es un fork en desarrollo activo del ya retirado Readarr, creado especialmente
      para administrar tus colecciones de audiolibros y libros electrónicos en una sola instancia.
      Trae el flujo de trabajo del conjunto *arr a los amantes de los libros — monitoreo
      automático, gestión de calidad e integración con clientes de descarga e indexadores populares.

      ## Características Principales

      - Administra libros electrónicos **y** audiolibros desde una interfaz unificada
      - Automatización estilo *arr: agregá autores/libros, configurá perfiles de calidad y dejá el resto a Chaptarr
      - Integración con qBittorrent, SABnzbd, NZBGet y otros, así como indexadores como Prowlarr
      - Diseñado para resolver los problemas de asignación de metadatos del Readarr original
      - Compatible con Audiobookshelf, Calibre-Web y otros frontends de biblioteca

      ## ¿Por Qué Ejecutarlo en CasaOS?

      Instalar Chaptarr en tu dispositivo CasaOS mantiene todo el proceso de automatización
      de libros de forma local — sin suscripciones en la nube, sin que tus datos salgan de tu
      red hogareña. Combinalo con Audiobookshelf o Calibre-Web en el mismo dispositivo para
      disfrutar de una experiencia de lectura y escucha completamente privada y autoalojada.
