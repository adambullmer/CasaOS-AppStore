name: recipe-buddy
services:
  recipe-buddy:
    command: []
    container_name: recipe-buddy
    environment:
      GROCY_API_KEY: <Generated API Token>
      GROCY_BASE_URL: http://casaos.local:9283
      NEXTAUTH_SECRET: <change-me>
      NEXTAUTH_URL: http://casaos.local:3005
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    x-casaos:
      envs:
        - container: GROCY_API_KEY
          description:
            en_us: "API Key to access Grocy instance, generated from the /manageapikeys path of the grocy website"
        - container: GROCY_BASE_URL
          description:
            en_us: "URL to the Grocy instance"
        - container: NEXTAUTH_SECRET
          description:
            en_us: "Random secret used in the recipe buddy app"
        - container: NEXTAUTH_URL
          description:
            en_us: "Public URL for the app will be exposed at"
    hostname: recipe-buddy
    image: ghcr.io/georgegebbett/recipe-buddy:latest
    ports:
      - target: 3000
        published: ${WEBUI_PORT:-3005}
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /home/node/app/data
x-casaos:
  author: self
  developer: georgegebbett
  category: Home Automation
  hostname: ""
  icon: https://github.com/adambullmer/CasaOS-AppStore/blob/main/Apps/RecipeBuddy/icon.svg?raw=true
  index: /
  port_map: ${WEBUI_PORT:-3005}
  scheme: http
  store_app_id: recipe-buddy
  architectures: # a list of architectures that the app supports
    - amd64
  title:
    en_US: Recipe Buddy
    zh_CN: 食谱助手
    fr_FR: Copain Recette
    es_ES: Compañero de Recetas
    de_DE: Rezept Kumpel
    ru_RU: Друг Рецептов
    it_IT: Amico Ricetta
    pt_BR: Companheiro de Receitas
    tr_TR: Yemek Tarifi Arkadaşı
    pl_PL: Przyjaciel Przepisów
    ko_KR: 레시피 버디
    ja_JP: レシピバディ
  description:
    en_US: Recipe import system for Grocy
    zh_CN: Grocy 的食谱导入系统，帮助您轻松管理和导入食谱。
    fr_FR: Un système d'importation de recettes pour Grocy, vous aidant à gérer et importer facilement des recettes.
    es_ES: Un sistema de importación de recetas para Grocy, que le ayuda a gestionar e importar recetas fácilmente.
    de_DE: Ein Rezept-Importsystem für Grocy, das Ihnen hilft, Rezepte einfach zu verwalten und zu importieren.
