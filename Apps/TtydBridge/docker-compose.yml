name: ttydbridge
services:
  ttydbridge:
    command: []
    container_name: ttydbridge
    environment:
      AUTO_ALLOW_PORT: true
      EXEC_DIR: /opt
      HTTP_PASSWORD: ""
      HTTP_USERNAME: ""
      PORT: 2222
      START_COMMAND: bash --login
    image: cp0204/ttydbridge:v0.0.4
    labels:
      icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/wetty.png
    pid: host
    privileged: true
    restart: unless-stopped
    volumes:
      - type: bind
        source: /opt
        target: /opt

x-casaos:
  architectures:
    - amd64
    - arm
    - arm64
  author: Cp0204
  category: Developer
  description:
    en_us: >
      ttydBridge acts as a "bridge" to the host environment, allowing you to
      easily access and use the host terminal in a web. It is built on ttyd and
      runs in a containerized manner, providing a secure and convenient remote
      endpoint experience.
    zh_cn: >
      ttydBridge 如一座“桥”，连通了宿主机环境，让你在浏览器中轻松访问和使用宿主机终端。它基于 ttyd
      构建，并以容器化的方式运行，提供了安全、便捷的远程终端体验。
  developer: Cp0204
  hostname: ""
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/wetty.png
  index: /
  is_uncontrolled: false
  main: ttydbridge
  port_map: "2222"
  scheme: http
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/ttydbridge/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/ttydbridge/screenshot-2.png
  store_app_id: ttydbridge
  tagline:
    en_us: Easy access to the host terminal in web
    zh_cn: 在浏览器中轻松访问宿主机终端
  tips:
    before_install:
      en_us: >
        1. You can set the `HTTP_USERNAME` and `HTTP_PASSWORD` variables to
        modify or remove HTTP authentication.

        2. The default username and password are `admin` and `password`.

        [Official DOC](https://hub.docker.com/r/cp0204/ttydbridge)
      zh_cn: |
        1. 可以设置 `HTTP_USERNAME` `HTTP_PASSWORD` 变量，修改与删掉 HTTP 鉴权。

        2. 默认的账号密码为 `admin` `password`。

        [官方文档](https://hub.docker.com/r/cp0204/ttydbridge)
  title:
    custom: ""
    en_us: ttydBridge
