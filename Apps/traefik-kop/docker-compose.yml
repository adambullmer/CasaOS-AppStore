  tips:
    before_install:
      en_US: |
        Traefik Kop requires a central Redis instance to store routing data. Please ensure:
        1. You have a Redis server running and accessible from this host.
        2. You know the IP and port of that Redis server (default is usually 6379).
        3. You configure the `REDIS_ADDR` environment variable during installation.
      zh_CN: |
        Traefik Kop 需要一个中央 Redis 实例来存储路由数据。请确保：
        1. 您已经运行了一个从此主机可访问的 Redis 服务器。
        2. 您知道该 Redis 服务器的 IP 和端口（默认通常为 6379）。
        3. 在安装过程中配置 `REDIS_ADDR` 环境变量。
