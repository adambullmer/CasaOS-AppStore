name: mousehole

services:
  mousehole:
    image: tmmrtn/mousehole:0.2.0
    container_name: mousehole
    restart: unless-stopped
    network_mode: bridge
    environment:
      TZ: $TZ
    ports:
      - target: 5010
        published: "${WEBUI_PORT:-5010}"
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /srv/mousehole
    deploy:
      resources:
        reservations:
          memory: "256M"

    x-casaos:
      envs:
        - container: TZ
          description:
            en_us: Timezone
            zh_cn: 时区
            zh_tw: 時區
            de_de: Zeitzone
            es_es: Zona horaria
            es_419: Zona horaria
            fr_fr: Fuseau horaire
            ja_jp: タイムゾーン
            ko_kr: 시간대
            ru_ru: Часовой пояс
            sv_se: Tidszon
            pt_pt: Fuso horário
      ports:
        - container: "5010"
          description:
            en_us: WebUI HTTP Port
            zh_cn: WebUI HTTP端口
            zh_tw: WebUI HTTP埠
            de_de: WebUI HTTP-Port
            es_es: Puerto HTTP WebUI
            es_419: Puerto HTTP WebUI
            fr_fr: Port HTTP WebUI
            ja_jp: WebUI HTTPポート
            ko_kr: WebUI HTTP 포트
            ru_ru: HTTP-порт WebUI
            sv_se: WebUI HTTP-port
            pt_pt: Porta HTTP WebUI
      volumes:
        - container: /srv/mousehole
          description:
            en_us: Data directory
            zh_cn: 数据目录
            zh_tw: 資料目錄
            de_de: Datenverzeichnis
            es_es: Directorio de datos
            es_419: Directorio de datos
            fr_fr: Répertoire de données
            ja_jp: データディレクトリ
            ko_kr: 데이터 디렉토리
            ru_ru: Каталог данных
            sv_se: Datakatalog
            pt_pt: Diretório de dados

x-casaos:
  architectures:
    - amd64
    - arm64
    - arm
  main: mousehole
  author: adambullmer
  category: Network
  description:
    en_US: |
      # Mousehole — Seedbox IP Updater for MAM

      A background service to update a seedbox IP for MAM and an HTTP server to manage it.
      This can be helpful if you are using a host/VPN/seedbox to seed and its IP address is not stable.

      ## Features
      - Background service that regularly updates MAM with the IP address of the host.
      - Frontend website to manage the service, allowing setting your MAM cookie, displaying status, and manual triggering of checks.
      - Local API server with management endpoints.
    zh_CN: |
      # Mousehole — 用于MAM的Seedbox IP更新器

      这是一个用于更新MAM seedbox IP的后台服务，并提供HTTP服务器进行管理。如果您正在使用主机、VPN或seedbox进行做种并且IP地址不稳定，这将非常有帮助。

      ## 功能
      - 定期使用主机的IP地址更新MAM的后台服务。
      - 用于管理服务的前端网站，允许设置您的MAM cookie，显示状态并手动触发检查。
      - 带有管理端点的本地API服务器。
    zh_TW: |
      # Mousehole — 用於MAM的Seedbox IP更新器

      這是一個用於更新MAM seedbox IP的後台服務，並提供HTTP伺服器進行管理。如果您正在使用主機、VPN或seedbox進行做種並且IP地址不穩定，這將非常有幫助。

      ## 功能
      - 定期使用主機的IP地址更新MAM的後台服務。
      - 用於管理服務的前端網站，允許設置您的MAM cookie，顯示狀態並手動觸發檢查。
      - 帶有管理端點的本地API伺服器。
    de_DE: |
      # Mousehole — Seedbox-IP-Updater für MAM

      Ein Hintergrunddienst zur Aktualisierung einer Seedbox-IP für MAM und ein HTTP-Server zur Verwaltung. Dies kann hilfreich sein, wenn Sie einen Host/VPN/Seedbox zum Seeden verwenden und dessen IP-Adresse nicht stabil ist.

      ## Funktionen
      - Hintergrunddienst, der MAM regelmäßig mit der IP-Adresse des Hosts aktualisiert.
      - Frontend-Website zur Verwaltung des Dienstes, die das Setzen Ihres MAM-Cookies, die Anzeige des Status und das manuelle Auslösen von Überprüfungen ermöglicht.
      - Lokaler API-Server mit Verwaltungs-Endpunkten.
    es_ES: |
      # Mousehole — Actualizador de IP de Seedbox para MAM

      Un servicio en segundo plano para actualizar la IP de un seedbox para MAM y un servidor HTTP para administrarlo. Esto puede ser útil si está utilizando un host/VPN/seedbox para sembrar y su dirección IP no es estable.

      ## Características
      - Servicio en segundo plano que actualiza regularmente MAM con la dirección IP del host.
      - Sitio web frontend para administrar el servicio, permitiendo configurar su cookie MAM, mostrar el estado y activar manualmente las comprobaciones.
      - Servidor API local con puntos finales de gestión.
    es_419: |
      # Mousehole — Actualizador de IP de Seedbox para MAM

      Un servicio en segundo plano para actualizar la IP de un seedbox para MAM y un servidor HTTP para administrarlo. Esto puede ser útil si está utilizando un host/VPN/seedbox para sembrar y su dirección IP no es estable.

      ## Características
      - Servicio en segundo plano que actualiza regularmente MAM con la dirección IP del host.
      - Sitio web frontend para administrar el servicio, permitiendo configurar su cookie MAM, mostrar el estado y activar manualmente las comprobaciones.
      - Servidor API local con puntos finales de gestión.
    fr_FR: |
      # Mousehole — Mise à jour IP Seedbox pour MAM

      Un service en arrière-plan pour mettre à jour une IP de seedbox pour MAM et un serveur HTTP pour la gérer. Cela peut être utile si vous utilisez un hôte/VPN/seedbox pour semer et que son adresse IP n'est pas stable.

      ## Fonctionnalités
      - Service en arrière-plan qui met régulièrement à jour MAM avec l'adresse IP de l'hôte.
      - Site web frontal pour gérer le service, permettant de définir votre cookie MAM, d'afficher le statut et de déclencher manuellement des vérifications.
      - Serveur API local avec des points d'accès de gestion.
    ja_JP: |
      # Mousehole — MAM 用 Seedbox IP アップデーター

      MAM 用のシードボックス IP を更新するバックグラウンドサービスと、それを管理する HTTP サーバーです。ホスト/VPN/シードボックスを使用してシードし、その IP アドレスが安定していない場合に役立ちます。

      ## 機能
      - ホストの IP アドレスで MAM を定期的に更新するバックグラウンドサービス。
      - サービスを管理するためのフロントエンドウェブサイトで、MAM クッキーの設定、ステータスの表示、手動でのチェックのトリガーを可能にします。
      - 管理エンドポイントを持つローカル API サーバー。
    ko_KR: |
      # Mousehole — MAM용 Seedbox IP 업데이터

      MAM용 시드박스 IP를 업데이트하고 관리하는 HTTP 서버를 제공하는 백그라운드 서비스입니다. 호스트/VPN/시드박스를 사용하여 시딩하고 IP 주소가 불안정한 경우 유용할 수 있습니다.

      ## 특징
      - 호스트의 IP 주소로 MAM을 정기적으로 업데이트하는 백그라운드 서비스.
      - 서비스 관리를 위한 프런트엔드 웹사이트로, MAM 쿠키 설정, 상태 표시 및 수동 확인 트리거를 허용합니다.
      - 관리 엔드포인트가 있는 로컬 API 서버.
    ru_RU: |
      # Mousehole — Обновление IP Seedbox для MAM

      Фоновая служба для обновления IP seedbox для MAM и HTTP-сервер для ее управления. Это может быть полезно, если вы используете хост/VPN/сидбокс для раздачи и его IP-адрес нестабилен.

      ## Функции
      - Фоновая служба, которая регулярно обновляет MAM IP-адресом хоста.
      - Фронтенд-сайт для управления службой, позволяющий устанавливать ваш MAM-файл cookie, отображать статус и вручную запускать проверки.
      - Локальный API-сервер с конечными точками управления.
    sv_SE: |
      # Mousehole — Seedbox IP-uppdaterare för MAM

      En bakgrundstjänst för att uppdatera en Seedbox IP för MAM och en HTTP-server för att hantera det.
      Användbart om du använder en värd/VPN/seedbox och IP-adressen inte är stabil.

      ## Funktioner
      - Bakgrundstjänst som regelbundet uppdaterar MAM med värdens IP-adress.
      - Frontend-webbplats för hantering, konfiguration av MAM-cookie och statusvisning.
      - Lokal API-server.
    pt_PT: |
      # Mousehole — Atualizador de IP de Seedbox para MAM

      Um serviço em segundo plano para atualizar o IP de um seedbox para MAM e um servidor HTTP para gerenciá-lo.
      Pode ser útil se estiver a utilizar um host/VPN/seedbox e a sua morada IP não for estável.

      ## Funcionalidades
      - Serviço que atualiza regularmente o MAM com a morada IP do host.
      - Front-end para configuração de cookies MAM e exibição de status.
      - Servidor API local para gestão.
    it_IT: |
      # Mousehole — Aggiornatore IP Seedbox per MAM

      Un servizio in background per aggiornare un IP seedbox per MAM e un server HTTP per gestirlo.
      Questo può essere utile se si utilizza un host/VPN/seedbox per il seeding e il suo indirizzo IP non è stabile.

      ## Caratteristiche
      - Servizio in background che aggiorna regolarmente MAM con l'indirizzo IP dell'host.
      - Sito web frontend per gestire il servizio, consentendo l'impostazione del cookie MAM, la visualizzazione dello stato e l'attivazione manuale dei controlli.
      - Server API locale con endpoint di gestione.
    pt_BR: |
      # Mousehole — Atualizador de IP de Seedbox para MAM

      Um serviço em segundo plano para atualizar o IP de um seedbox para MAM e um servidor HTTP para gerenciá-lo.
      Isso pode ser útil se você estiver usando um host/VPN/seedbox para semear e seu endereço IP não for estável.

      ## Recursos
      - Serviço em segundo plano que atualiza regularmente o MAM com o endereço IP do host.
      - Site frontend para gerenciar o serviço, permitindo configurar seu cookie MAM, exibir o status e acionar verificações manualmente.
      - Serviço API local com endpoints de gerenciamento.
    tr_TR: |
      # Mousehole — MAM için Seedbox IP Güncelleyici

      MAM için bir seedbox IP'sini güncelleyen bir arka plan hizmeti ve onu yönetmek için bir HTTP sunucusu.
      Bir ana bilgisayar/VPN/seedbox kullanarak tohumluyorsanız ve IP adresi kararlı değilse bu yararlı olabilir.

      ## Özellikler
      - MAM'ı ana bilgisayarın IP adresiyle düzenli olarak güncelleyen arka plan hizmeti.
      - Hizmeti yönetmek için ön uç web sitesi, MAM çerezinizi ayarlamaya, durumu görüntülemeye ve kontrolleri manuel olarak tetiklemeye olanak tanır.
      - Yönetim uç noktalarına sahip yerel API sunucusu.
    pl_PL: |
      # Mousehole — Aktualizator IP Seedbox dla MAM

      Usługa w tle do aktualizacji adresu IP seedboxa dla MAM oraz serwer HTTP do zarządzania nim.
      Może to być pomocne, jeśli używasz hosta/VPN/seedboxa do seedowania, a jego adres IP nie jest stabilny.

      ## Funkcje
      - Usługa w tle, która regularnie aktualizuje MAM adresem IP hosta.
      - Witryna internetowa do zarządzania usługą, umożliwiająca ustawienie pliku cookie MAM, wyświetlanie statusu i ręczne wyzwalanie kontroli.
      - Lokalny serwer API z punktami końcowymi zarządzania.
