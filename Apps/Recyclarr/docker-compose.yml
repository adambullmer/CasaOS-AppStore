name: recyclarr
services:
  recyclarr:
    command: []
    container_name: recyclarr
    environment:
      CRON_SCHEDULE: 0 4 * * *
      PGID: $PGID
      PUID: $PUID
      TZ: $TZ
    hostname: recyclarr
    image: ghcr.io/recyclarr/recyclarr:7.2.1
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
    x-casaos: {}
x-casaos:
  architectures:
    - amd64
  author: self
  developer: Recyclarr Team
  category: Utilities
  hostname: ""
  icon: https://recyclarr.dev/img/recyclarr.png
  index: /
  port_map: ""
  scheme: http
  store_app_id: recyclarr
  title:
    custom: Recyclarr
    zh_cn: 瑞赛克拉
    fr_fr: Recyclarr
    es_es: Recyclarr
    de_de: Recyclarr
    ru_ru: Ресайклар
    it_it: Recyclarr
    pt_br: Recyclarr
    tr_tr: Recyclarr
    pl_pl: Recyclarr
    ko_kr: 리사이클러
    ja_jp: リサイクラー
  description:
