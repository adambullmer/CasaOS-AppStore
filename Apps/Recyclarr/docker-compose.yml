    de_de: Synchronisierung der Trash Guides-Konfigurationen mit Sonarr/Radarr
    ru_ru: Синхронизация конфигураций Trash Guides с Sonarr/Radarr
    it_it: Sincronizzazione delle configurazioni di Trash Guides con Sonarr/Radarr
    pt_br: Sincronização das configurações do Trash Guides com o Sonarr/Radarr
    tr_tr: Trash Guides yapılandırmalarının Sonarr/Radarr ile senkronizasyonu
