name: firefly-iii

services:
  app:
    image: fireflyiii/core:latest
    hostname: firefly-iii-core
    container_name: firefly_iii_core
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/upload
        target: /var/www/html/storage/upload
    ports:
      - target: 8080
        published: ${WEBUI_PORT:-8080}
        protocol: tcp
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=$TZ
      - APP_ENV=production
      - SITE_OWNER=mail@example.com
      - APP_KEY=afa339a8ecf9439ab35b2d1c7db04d12
      - APP_URL=http://localhost:8080
      - DEFAULT_LANGUAGE=en_US
      - DEFAULT_LOCALE=equal
      - TRUSTED_PROXIES=
      - DB_CONNECTION=mysql
      - DB_HOST=firefly-iii-db
      - DB_PORT=3306
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=secret_firefly_password
      - STATIC_CRON_TOKEN=10946d4fc5624a4da4f74ad02f786207
      - AUTHENTICATION_GUARD=web
      - ENABLE_EXCHANGE_RATES=false
  db:
    image: mariadb:lts
    hostname: firefly-iii-db
    container_name: firefly_iii_db
    restart: unless-stopped
    # env_file: .db.env
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_USER=firefly
      - MYSQL_PASSWORD=secret_firefly_password
      - MYSQL_DATABASE=firefly
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config/data
        target: /var/lib/mysql
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

  importer:
    image: fireflyiii/data-importer:latest
    hostname: firefly-iii-importer
    restart: unless-stopped
    container_name: firefly_iii_importer
    ports:
      - target: 8080
        published: ${WEBUI_PORT:-8081}
        protocol: tcp
    depends_on:
      - app
    # env_file: .importer.env
    environment:
      - TZ=$TZ
      - FIREFLY_III_URL=
      - VANITY_URL=
      - FIREFLY_III_ACCESS_TOKEN=
      - FIREFLY_III_CLIENT_ID=
      - APP_NAME=DataImporter
      - AUTO_IMPORT_SECRET=ae343849-eed2-4785-a6de-06cf34d3c968
      - CAN_POST_AUTOIMPORT=false
      - CAN_POST_FILES=false

  cron:
    #
    # To make this work, set STATIC_CRON_TOKEN in your .env file or as an environment variable and replace PLEASE_REPLACE_WITH_32_CHAR_CODE below
    # The STATIC_CRON_TOKEN must be *exactly* 32 characters long
    #
    image: alpine:latest
    restart: always
    container_name: firefly_iii_cron
    environment:
      - PGID=$PGID
      - PUID=$PUID
      - TZ=$TZ
      - APP_HOST=firefly-iii-core
      - APP_PORT=${WEBUI_PORT:8080}
      - APP_KEY=afa339a8ecf9439ab35b2d1c7db04d12
    command: sh -c "
      apk add tzdata
      && ln -s /usr/share/zoneinfo/${TZ} /etc/localtime
      | echo \"0 3 * * * wget -qO- http://${APP_HOST}:${APP_PORT}/api/v1/cron/${APP_KEY}; echo\"
      | crontab -
      && crond -f -L /dev/stdout"

x-casaos:
  architectures:
    - amd64
  author: self
  developer: James Cole
  category: Finance
  hostname: ""
  icon: https://github.com/firefly-iii/firefly-iii/blob/main/public/maskable-icon.svg?raw=true
  index: /
  main: app
  is_uncontrolled: false
  port_map: ${WEBUI_PORT:-8080}
  scheme: http
  store_app_id: firefly-iii
  title:
    custom: Firefly III
  tagline:
    en_us: A free and open source personal finance manager
  description:
    en_us: |
      "Firefly III" is a (self-hosted) manager for your personal finances.
      It can help you keep track of your expenses and income, so you can spend less and save more.
      Firefly III supports the use of budgets, categories and tags.
      Using a bunch of external tools, you can import data.
      It also has many neat financial reports available.

      Firefly III should give you insight into and control over your finances.
      Money should be useful, not scary.
      You should be able to see where it is going, to feel your expenses and to...
      wow, I'm going overboard with this aren't I?

      But you get the idea: this is your money.
      These are your expenses.
      Stop them from controlling you.
      I built this tool because I started to dislike money.
      Having money, not having money, paying bills with money, you get the idea.
      But no more. I want to feel "safe", whatever my balance is.
      And I hope this tool can help you.
      I know it helps me.
