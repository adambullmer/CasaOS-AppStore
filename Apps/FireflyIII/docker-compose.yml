  tagline:
    en_us: A free and open source personal finance manager
    zh_cn: 一个免费且开源的个人财务管理工具
    fr_fr: Un gestionnaire de finances personnelles gratuit et open source
    es_es: Un gestor de finanzas personales gratuito y de código abierto
    de_de: Ein kostenloser und quelloffener persönlicher Finanzmanager
    ru_ru: Бесплатный менеджер личных финансов с открытым исходным кодом
    it_it: Un gestore delle finanze personali gratuito e open source
    pt_br: Um gerenciador de finanças pessoais gratuito e de código aberto
